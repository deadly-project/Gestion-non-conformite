spring.config.import=optional:file:.env[.properties]

spring.application.name=backend-gestion-nc
spring.datasource.url=jdbc:postgresql://localhost:5432/smq_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# CORS
app.frontend-urls=${APP_FRONTEND_URLS:http://localhost:5173}

# Administrateur initial
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.matricule=${ADMIN_MATRICULE:}
app.admin.nom=${ADMIN_NOM:Administrateur}
app.admin.prenom=${ADMIN_PRENOM:SMQ}