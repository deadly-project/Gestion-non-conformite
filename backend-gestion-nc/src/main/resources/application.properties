spring.config.import=optional:file:.env[.properties]

spring.application.name=backend-gestion-nc
spring.datasource.url=jdbc:postgresql://localhost:5432/smq_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# CORS
app.frontend-urls=${APP_FRONTEND_URLS:http://localhost:5173}

# Administrateur initial
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.matricule=${ADMIN_MATRICULE:}
app.admin.nom=${ADMIN_NOM:Administrateur}
app.admin.prenom=${ADMIN_PRENOM:SMQ}

logging.level.org.springframework.security=DEBUG

#envoie d'email
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=true
app.mail.from=${MAIL_FROM:no-reply@smq.local}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# false = l'email ne contient PAS le mot de passe (recommandé)
app.mail.inclure-mot-de-passe-temporaire=false

#log d'erreur
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000